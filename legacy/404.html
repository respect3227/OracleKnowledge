<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle 数据库教程 - 离线</title>
<link rel="stylesheet" href="../style.css">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f9;margin:0;padding:40px 20px;display:flex;align-items:center;justify-content:center;min-height:100vh}
.offline-box{text-align:center;max-width:400px;padding:40px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(20,30,60,.06)}
.offline-box .icon{font-size:4rem;color:#C74634;margin-bottom:20px}
.offline-box h1{color:#1a1a2e;margin:0 0 12px}
.offline-box p{color:#555;margin:0 0 24px;line-height:1.6}
.offline-box button{background:#C74634;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:1rem;cursor:pointer}
.offline-box button:hover{background:#a33}
</style>
</head>
<body>
<div class="offline-box">
  <div class="icon">📡</div>
  <h1>当前处于离线状态</h1>
  <p>网络连接已断开，已访问的页面可以继续浏览。请检查网络后重试。</p>
  <button onclick="location.reload()">重新加载</button>
</div>
</body>
</html>
